services:
  # Backend API (Spring Boot). Render doesn't provide a native Java runtime, so we deploy via Docker.
  - type: web
    name: expense-tracker-api
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    envVars:
      # Use H2 file DB by default (ephemeral on Render Free; use an external DB for persistence).
      - key: SPRING_PROFILES_ACTIVE
        value: local
      # If you keep server.port fixed, set PORT to match. (We also read PORT in application.properties.)
      - key: PORT
        value: 8080

  # Frontend (Vite static build)
  - type: web
    name: expense-tracker-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # Set this in the Render dashboard after the backend is created (value depends on your backend URL).
    envVars:
      - key: VITE_API_BASE_URL
        value: ""
    routes:
      # SPA fallback
      - type: rewrite
        source: "/*"
        destination: /index.html

