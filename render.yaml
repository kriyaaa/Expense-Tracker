databases:
  - name: expense-tracker-db
    plan: free
    databaseName: expense_tracker
    user: expense_tracker

services:
  # Backend API (Spring Boot). Render doesn't provide a native Java runtime, so we deploy via Docker.
  - type: web
    name: expense-tracker-api
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: expense-tracker-db
          property: connectionString

  # Frontend (Vite static build)
  - type: web
    name: expense-tracker-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # Set this in the Render dashboard after the backend is created (value depends on your backend URL).
    envVars:
      - key: VITE_API_BASE_URL
        value: ""
    routes:
      # SPA fallback
      - type: rewrite
        source: "/*"
        destination: /index.html
